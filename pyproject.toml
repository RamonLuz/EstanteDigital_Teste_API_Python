[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estantedigital-api-tests"
version = "0.1.0"
description = "Acceptance tests for the EstanteDigital REST API using Behave"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "behave>=1.2.6,<2.0",
    "jsonschema>=4.23,<5.0",
    "python-dotenv>=1.0,<2.0",
    "referencing>=0.35,<1.0",
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
